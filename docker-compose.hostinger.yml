services:
  web:
    image: ghcr.io/pdpablo/spook-shack:${SPOOK_SHACK_IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.spook-shack.rule=Host(`spook-shack.com`) || Host(`www.spook-shack.com`)
      - traefik.http.routers.spook-shack.entrypoints=websecure
      - traefik.http.routers.spook-shack.tls.certresolver=letsencrypt
      - traefik.http.services.spook-shack.loadbalancer.server.port=8080
    environment:
      PORT: 8080
      SPOOK_SHACK_HOME: /data
      SPOOK_SHACK_FERNET_KEY: ${SPOOK_SHACK_FERNET_KEY:-}
      RANSOMWARELIVE_API_TOKEN: ${RANSOMWARELIVE_API_TOKEN:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_CHANNEL: ${TG_CHANNEL:-}
      TG_SESSION_NAME: ${TG_SESSION_NAME:-spook-shack}
      TG_LIMIT: ${TG_LIMIT:-100}
    volumes:
      - spook-shack-data:/data

volumes:
  spook-shack-data:
