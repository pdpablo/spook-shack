services:
  web:
    image: ghcr.io/pdpablo/spook-shack:${SPOOK_SHACK_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SPOOK_SHACK_HOME: /data
      SPOOK_SHACK_FERNET_KEY: ${SPOOK_SHACK_FERNET_KEY:-}
      RANSOMWARELIVE_API_TOKEN: ${RANSOMWARELIVE_API_TOKEN:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_CHANNEL: ${TG_CHANNEL:-}
      TG_SESSION_NAME: ${TG_SESSION_NAME:-spook-shack}
      TG_LIMIT: ${TG_LIMIT:-100}
    volumes:
      - spook-shack-data:/data

volumes:
  spook-shack-data:
