services:
  api:
    build: .
    command: ["spook-shack", "serve", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      SPOOK_SHACK_HOME: /data
    volumes:
      - spook-shack-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build: .
    command: ["spook-shack", "worker", "--ingest-on-start", "--interval-seconds", "300"]
    env_file:
      - .env
    environment:
      SPOOK_SHACK_HOME: /data
    volumes:
      - spook-shack-data:/data
    restart: unless-stopped

volumes:
  spook-shack-data:
