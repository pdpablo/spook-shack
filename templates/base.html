<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Spook Shack" }}</title>
    <link rel="stylesheet" href="/static/spook.css" />
  </head>
  <body>
    <div class="backdrop"></div>
    <div class="app-shell">
      {% if nav_links %}
      <aside class="app-nav panel">
        <div class="nav-brand">
          <a href="/" class="brand-link">Spook Shack</a>
          <div class="nav-meta">
            {% if user %}
            <span class="pill dim">{{ user.role }}</span>
            {% endif %}
            <span class="nav-caption">Dark SIEM console</span>
          </div>
        </div>
        <div class="nav-links">
          {% for link in nav_links %}
          <a class="nav-link {% if active_page == link.label|lower %}active{% endif %}" href="{{ link.href }}">{{ link.label }}</a>
          {% endfor %}
        </div>
        {% if user %}
        <div class="nav-footer">
          <span class="nav-caption">{{ user.username }}</span>
          <form method="post" action="/logout" class="nav-logout">
            <button type="submit" class="ghost">Logout</button>
          </form>
        </div>
        {% endif %}
      </aside>
      {% endif %}
      <main class="workspace">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
