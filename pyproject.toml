[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spook-shack-mvp"
version = "0.1.0"
description = "Spook Shack threat-intelligence MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "feedparser>=6.0",
  "telethon>=1.36",
  "cryptography>=42.0",
  "tldextract>=5.1",
  "croniter>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
spook-shack = "spook_shack.cli:main"

[tool.setuptools]
packages = ["spook_shack", "dashboard"]

[tool.pytest.ini_options]
pythonpath = ["."]
